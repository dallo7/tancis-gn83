services:
  - type: web
    name: tcams-tancis-gn83
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/tcams.db